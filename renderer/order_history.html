<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History — ASPORTS ZONE</title>
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/history.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    /* Specific overrides if needed */
    .history-card--order {
      border-left: 4px solid var(--accent-orange);
    }
    .history-card__type--order {
      background: var(--accent-orange-dim);
      color: var(--accent-orange);
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow--1"></div>
  <div class="bg-glow bg-glow--2"></div>

  <div class="app-container">
    <!-- Header -->
    <header class="header" id="app-header">
      <div class="header__left">
        <button class="btn-back" id="btn-back" title="Back" style="border-radius: 50%; background: rgba(255,255,255,0.05); width: 42px; height: 42px;">
          <span class="material-icons-round">arrow_back</span>
        </button>
        <div class="header__brand" style="margin-left: 10px;">
          <span class="header__icon material-icons-round" style="font-size: 32px; color: var(--accent-cyan);">history</span>
          <div>
            <h1 class="header__title" style="font-size: 1.4rem; letter-spacing: 0.5px; background: none; -webkit-text-fill-color: var(--accent-cyan); color: var(--accent-cyan);">Order History</h1>
            <p class="header__subtitle" style="font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px;">PURCHASE ORDERS</p>
          </div>
        </div>
      </div>
      <div class="header__meta">
        <span class="header__date" id="header-date" style="color: var(--text-secondary); opacity: 0.8;"></span>
        <span class="header__time" id="header-time" style="color: var(--accent-cyan); font-weight: 600;"></span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="history-main">
      <!-- Summary Chips -->
      <div class="summary-row">
        <div class="summary-chip" id="stat-total-orders-chip">
          <span class="material-icons-round">receipt_long</span>
          <span id="stat-total-orders">0</span> total orders
        </div>
        <div class="search-box">
          <span class="material-icons-round search-box__icon">search</span>
          <input type="text" id="search-input" class="search-box__input" placeholder="Search by supplier or order ID..." autocomplete="off">
        </div>
      </div>

      <!-- Content -->
      <section class="section history-section" style="background: transparent; border: none; padding: 0; box-shadow: none;">
        <div id="orders-list">
          <!-- Order cards injected by JS -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display:none; text-align: center; padding: 60px 0;">
          <span class="material-icons-round" style="font-size: 64px; color: var(--text-muted); opacity: 0.2; display: block; margin-bottom: 20px;">history_toggle_off</span>
          <p class="empty-state__text" style="font-size: 1.2rem; font-weight: 600; color: var(--text-secondary);">No orders found</p>
          <p class="empty-state__sub" style="color: var(--text-muted);">Created orders will appear here</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast">
    <span class="material-icons-round toast__icon" id="toast-icon">check_circle</span>
    <span class="toast__msg" id="toast-msg"></span>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="order-modal">
      <div class="modal__header">
        <div class="modal__header-left">
          <span class="material-icons-round modal__icon">receipt</span>
          <h3 class="modal__title">Order Detail <span id="modal-order-id">#—</span></h3>
        </div>
        <div class="modal__header-actions">
          <button class="btn-detail-action btn-detail-action--edit" id="btn-modal-edit" title="Edit Order">
            <span class="material-icons-round">edit</span>
            EDIT
          </button>
          <button class="btn-detail-action btn-detail-action--pdf" id="btn-modal-download" title="Download Order PDF">
            <span class="material-icons-round">file_download</span>
            DOWNLOAD
          </button>
          <button class="btn-detail-action btn-detail-action--purple" id="btn-modal-share" title="Share Order">
            <span class="material-icons-round">share</span>
            SHARE
          </button>
          <button class="modal__close" id="modal-close">
            <span class="material-icons-round">close</span>
          </button>
        </div>
      </div>

      <div id="modal-view-section">
        <div class="modal__info">
          <div class="modal__info-row">
            <span class="modal__info-label">Supplier</span>
            <span class="modal__info-value" id="modal-supplier">—</span>
          </div>
          <div class="modal__info-row">
            <span class="modal__info-label">Date</span>
            <span class="modal__info-value" id="modal-date">—</span>
          </div>
          <div class="modal__info-row" id="modal-phone-row">
            <span class="modal__info-label">Phone</span>
            <span class="modal__info-value" id="modal-phone">—</span>
          </div>
          <div class="modal__info-row" id="modal-email-row">
            <span class="modal__info-label">Email</span>
            <span class="modal__info-value" id="modal-email">—</span>
          </div>
          <div class="modal__info-row" id="modal-address-row" style="grid-column: span 2;">
            <span class="modal__info-label">Address</span>
            <span class="modal__info-value" id="modal-address">—</span>
          </div>
        </div>

        <div class="modal__table-wrap">
          <table class="modal__table">
            <thead>
              <tr>
                <th style="width: 40px;">#</th>
                <th>Product</th>
                <th style="text-align: right; width: 100px;">Quantity</th>
              </tr>
            </thead>
            <tbody id="modal-items-body">
            </tbody>
          </table>
        </div>
      </div>

      <!-- Edit Section -->
      <div id="modal-edit-section" style="display:none; padding: 24px;">
        <div class="edit-form">
          <div class="form-group">
            <label class="form-label">Supplier Name</label>
            <input type="text" id="edit-supplier" class="form-input" placeholder="Enter supplier name">
          </div>
          <div class="form-row" style="display: flex; gap: 16px; margin-bottom: 20px;">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Phone</label>
              <input type="text" id="edit-phone" class="form-input" placeholder="Phone" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">Email</label>
              <input type="email" id="edit-email" class="form-input" placeholder="Email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Address</label>
            <textarea id="edit-address" class="form-input" rows="2" placeholder="Address"></textarea>
          </div>
          
          <div style="margin-top: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--text-secondary);">Order Items</h4>
              <button class="btn-refresh" id="btn-add-edit-item" style="padding: 6px 12px; font-size: 0.75rem;">+ Add Item</button>
            </div>
            <div id="edit-items-container" style="max-height: 200px; overflow-y: auto;">
              <!-- Items added here -->
            </div>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 32px; justify-content: flex-end;">
            <button class="btn-refresh" id="btn-cancel-edit" style="min-width: 100px;">CANCEL</button>
            <button class="btn-export" id="btn-save-edit" style="min-width: 120px;">SAVE CHANGES</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../scripts/order_history.js"></script>
</body>
</html>
